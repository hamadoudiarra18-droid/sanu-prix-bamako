plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sanuprix.bamako'
    compileSdk 35

    defaultConfig {
        applicationId "com.sanuprix.bamako.app"
        minSdk 21
        targetSdk 35
        versionCode 6
        versionName "1.4"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Aucune bibliothèque externe : l'application n'utilise que le WebView d'Android.
dependencies {
}
