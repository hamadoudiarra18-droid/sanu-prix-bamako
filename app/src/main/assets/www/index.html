<!doctype html><html><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><meta name="theme-color" content="#0b2a7a"><meta name="description" content="Le prix de l'or à Bamako en direct, avec calculatrice par carat."><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Sanu Prix"><meta name="application-name" content="Sanu Prix à Bamako"><title>Sanu Prix à Bamako</title></head><body>
<style id="pagecss">
/* Layout: one column, big price per gram on top, carat grid, calculator, update panel for the owner */
:root{
  --bg:#f3f2ee; --surface:#ffffff; --ink:#1b1f33; --muted:#5d6278; --line:#dcdbe3;
  --indigo:#23306b; --gold:#a8730f; --gold-soft:#f3e6c6; --up:#1f7a4d; --down:#b23a2e;
  --f-display:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --f-num:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12142a; --surface:#1b1e3a; --ink:#ecebf3; --muted:#a3a6be; --line:#2e3258;
  --indigo:#aab6f2; --gold:#e6b450; --gold-soft:#3a3120; --up:#5fc994; --down:#ef8a7f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12142a; --surface:#1b1e3a; --ink:#ecebf3; --muted:#a3a6be; --line:#2e3258;
  --indigo:#aab6f2; --gold:#e6b450; --gold-soft:#3a3120; --up:#5fc994; --down:#ef8a7f; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
#app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;gap:20px}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0}
h2{font-size:1rem;font-weight:600;letter-spacing:.01em}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
header{display:grid;gap:4px}
header h1{font-size:1.15rem;color:var(--indigo)}
.hero{background:var(--indigo);color:#fff;border-radius:18px;padding:22px 20px;display:grid;gap:6px;position:relative;overflow:hidden}
:root[data-theme="dark"] .hero{background:#232a63}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:#232a63}}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#f5d488,#a8730f 70%);opacity:.9}
.hero .eyebrow{color:#c9cff0}
.hero .big{font-family:var(--f-display);font-size:clamp(2.2rem,9vw,3.2rem);font-weight:700;line-height:1.05;position:relative;z-index:1}
.hero .big small{font-size:.4em;font-weight:500;color:#dfe3fa}
.hero .meta{font-size:.82rem;color:#dfe3fa;position:relative;z-index:1;max-width:70%}
.chips{display:flex;flex-wrap:wrap;gap:8px;position:relative;z-index:1}
.chip{background:rgba(255,255,255,.12);border-radius:999px;padding:3px 10px;font-size:.78rem}
section{display:grid;gap:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.k{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.k .lab{font-size:.8rem;color:var(--muted)}
.k .val{font-size:1.1rem;font-weight:600}
.k .sub{font-size:.75rem;color:var(--muted)}
.k.on{border-color:var(--gold);background:var(--gold-soft)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
label{display:grid;gap:4px;font-size:.82rem;color:var(--muted);font-weight:500}
input,select{font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box;min-width:0}
input[aria-invalid="true"]{border-color:var(--down)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.result{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px;border-top:1px dashed var(--line);padding-top:12px}
.result .val{font-family:var(--f-display);font-size:1.6rem;font-weight:700;color:var(--gold)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--indigo);color:var(--bg);border-color:var(--indigo)}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 16px;background:var(--gold);color:#fff;cursor:pointer}
.btn[disabled]{opacity:.5;cursor:default}
.note{font-size:.8rem;color:var(--muted);margin:0}
.msg{font-size:.85rem;margin:0}
.msg.ok{color:var(--up)} .msg.err{color:var(--down)}
.hist{display:grid;gap:0;margin:0;padding:0;list-style:none}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.hist li:last-child{border-bottom:0}
a{color:var(--indigo)}
details summary{cursor:pointer;font-weight:600;font-family:var(--f-display);font-size:1rem}
.ad{position:relative;background:var(--surface);border-block:1px solid var(--line);overflow:hidden}
/* Annonces en pleine largeur d'écran : bord à bord sur téléphone, toute la fenêtre sur ordinateur */
body{overflow-x:clip}
#ads{margin-inline:-16px}
@media (min-width:700px){#ads{margin-inline:calc(50% - 50vw)}}
.ad .slide{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:center;padding:14px 16px 10px;max-width:640px;margin-inline:auto;box-sizing:border-box;width:100%}
.ad .t{font-family:var(--f-display);font-weight:600;font-size:1.15rem;margin:0}
.ad .d{margin:2px 0 0;font-size:.95rem;color:var(--muted);white-space:pre-line}
.ad .tel{margin:6px 0 0;font-size:.95rem;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ad .tel b{font-family:var(--f-num);user-select:all}
.ad .tag{position:absolute;top:8px;right:10px;z-index:3;font-size:.62rem;text-transform:uppercase;letter-spacing:.12em;color:#fff;background:rgba(0,0,0,.55);border-radius:999px;padding:2px 8px}
/* Zone photo/vidéo : toute la largeur, forme d'origine respectée, côtés remplis par un flou de l'image */
.ad .media{position:relative;overflow:hidden;background:#111;width:100%;aspect-ratio:16/9;max-height:80vh}
.ad .media .bg{position:absolute;inset:-10%;width:120%;height:120%;filter:blur(22px) brightness(.55);background-size:cover;background-position:center}
.ad .media .main{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;display:block;border-radius:0}
/* Téléphone : annonce compacte (image ≈ 30 % plus basse, texte réduit à 2 lignes) */
@media (max-width:520px){
  .ad .media{max-height:min(14vh,96px)}
  .ad .slide{padding:8px 16px 4px;gap:6px}
  .ad .t{font-size:.95rem}
  .ad .d{font-size:.82rem;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ad .tel{font-size:.82rem;margin-top:4px}
  .ad .tag{font-size:.55rem;top:6px;right:8px;padding:1px 6px}
  .ad .snd,.ad .fs{width:30px;height:30px;padding:0;justify-content:center;bottom:6px;border-radius:50%}
  .ad .snd .lbl,.ad .fs .lbl{display:none}
  .ad .fs{right:8px}.ad .snd{left:8px}
  .ad .tag{font-size:9px}
  .dots button{width:20px;height:20px}
  .dots{padding-bottom:2px}
}
.ad .media:fullscreen{max-height:none;aspect-ratio:auto!important;width:100vw;height:100vh}
.ad .media:-webkit-full-screen{max-height:none;aspect-ratio:auto!important;width:100vw;height:100vh}
.ad .snd,.ad .fs{position:absolute;bottom:10px;z-index:2;font:inherit;font-size:.8rem;font-weight:600;border:0;border-radius:999px;padding:6px 12px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}
.ad .snd,.ad .fs{display:inline-flex;align-items:center;gap:6px}
.ad .snd svg,.ad .fs svg{flex:none}
.ad .snd{left:10px}
.ad .fs{right:10px}
.ad.empty{border-style:dashed;padding:14px;text-align:center;color:var(--muted);font-size:.88rem}
.dots{display:flex;gap:4px;justify-content:center;padding-bottom:6px}
.dots button{width:24px;height:24px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center}
.dots button::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots button[aria-current="true"]::before{background:var(--gold)}
.adlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.adlist li{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.adlist li span{min-width:0;overflow-wrap:anywhere}
.adlist li.off span{opacity:.5}
.mini{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer}
.mini.danger{color:var(--down);border-color:var(--down)}
textarea{font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box;min-height:64px;resize:vertical}
.show-sm{display:none}
.calc .amt{min-width:0}
.calc .amt>*{white-space:nowrap}
#app{grid-template-columns:minmax(0,1fr)}
#app>*{min-width:0}
.hero .meta{overflow-wrap:anywhere}
.hero .meta .num{white-space:normal!important}
.hero .listen{justify-self:start;display:inline-flex;align-items:center;gap:8px;margin-top:4px;font:inherit;font-weight:600;font-size:.9rem;color:#1b1f33;background:#f5d488;border:0;border-radius:999px;padding:8px 14px;cursor:pointer;position:relative;z-index:1}
.hero .listen.on{background:#fff}
.hero .listenrow{display:flex;flex-wrap:wrap;gap:8px;position:relative;z-index:1}
.hero .listen.alt{background:rgba(255,255,255,.14);color:#fff}
.hero .listen.alt.on{background:#fff;color:#1b1f33}
.hero .listen:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* Historique compact : une ligne par jour */
.histc{gap:6px}
.histc h2{font-size:.85rem;color:var(--muted);font-weight:600}
.histc .panel{padding:4px 12px}
.histc .hist li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:5px 0;font-size:.8rem;white-space:nowrap;align-items:baseline}
.histc .hist li .num{text-align:right}
.histc .bamc{color:var(--muted);font-size:.74rem}
@media (max-width:380px){.histc .hist li{font-size:.72rem;gap:6px}.histc .bamc{font-size:.68rem}}
/* Montants en Bam. (dɔrɔmɛ) sous les F CFA */
.hero .bigbam{font-family:var(--f-display);font-size:clamp(1.2rem,4.5vw,1.6rem);font-weight:600;color:#f5d488;line-height:1.1;position:relative;z-index:1}
.hero .bigbam small{font-size:.6em;font-weight:500}
.amt{display:grid;justify-items:end;gap:0;text-align:right}
.amt .bam{font-size:.78rem;color:var(--muted)}
.amt .bam-main{font-family:var(--f-display);font-size:1rem;font-weight:700;color:var(--gold)}
/* Calculatrice compacte */
.panel.calc{padding:12px 14px;gap:8px}
.calc .seg.karats{grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calc .seg.karats button{padding:4px 2px;font-size:.8rem}
.calc .inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(8em,1fr));gap:8px}
.calc label{font-size:.76rem;gap:2px}
.calc input{padding:7px 10px;font-size:.95rem}
.calc .note{font-size:.72rem}
.calc .result{padding-top:6px;font-size:.85rem}
.calc .result .val{font-size:1.25rem}
.calc .result{flex-wrap:nowrap;align-items:center}
.calc .result .lab{min-width:0;line-height:1.25}
.calc .result > :last-child{white-space:nowrap;text-align:right}
@media (max-width:520px){.calc .result .val{font-size:1.1rem}.calc .seg.karats button{font-size:.74rem}}
.seg.karats{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.4em,1fr));gap:6px}
.seg.karats button{padding:6px 4px;text-align:center}
@media (max-width:520px){.ads-admin{display:none!important}}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:-8px}
.cta .btn-wa{flex:1 1 auto}
.btn-wa{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:.95rem;text-decoration:none;border-radius:999px;padding:11px 18px;background:#1a7f4b;text-align:center;color:#fff;border:2px solid #1a7f4b}
.btn-wa.share{background:var(--surface);color:#1a7f4b}
:root[data-theme="dark"] .btn-wa.share{color:#5fc994;border-color:#5fc994}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-wa.share{color:#5fc994;border-color:#5fc994}}
.btn-wa{min-width:0;overflow-wrap:anywhere}.btn-wa svg{flex:none}
@media (max-width:520px){.cta{gap:8px}.btn-wa{font-size:.88rem;padding:10px 12px;gap:6px}}
.btn-wa:hover{filter:brightness(1.08)}
.btn-wa:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* Téléphone : bandeau du prix plus compact */
@media (max-width:520px){
  .hero{padding:14px 16px;gap:4px;border-radius:14px}
  .hero .big{font-size:2.3rem}
  .hero .eyebrow{font-size:.66rem;letter-spacing:.08em}
  .hero .meta{max-width:none;font-size:.8rem}
  .hero::after{width:96px;height:96px;inset:auto -28px -36px auto}
  .chip{font-size:.74rem;padding:2px 8px}
  .hide-sm{display:none!important}
  .show-sm{display:inline}
}
/* Téléphone : tout tient sur un seul écran */
@media (max-width:520px){
  #app{padding-block:8px 16px;gap:8px}
  header .eyebrow{display:none}
  header h1{font-size:.95rem}
  .hero{padding:10px 14px;gap:2px}
  .hero > .eyebrow{font-size:.6rem}
  .hero .big{font-size:1.9rem}
  .hero .bigbam{font-size:.95rem}
  .hero .chips{display:none}
  .hero .meta{font-size:.72rem;line-height:1.35}
  .hero::after{width:70px;height:70px;inset:auto -22px -26px auto}
  .cta{margin-top:0;gap:6px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .cta .btn-wa{flex:none;min-width:0;padding:3px 6px;font-size:.64rem;line-height:1.1;gap:4px;white-space:nowrap;border-width:1px}
  .cta .btn-wa svg{width:12px;height:12px}
  .calcsec{gap:4px}
  .calcsec h2{font-size:.85rem}
  .panel.calc{padding:8px 10px;gap:5px}
  .calc .seg.karats button{padding:3px 1px}
  .calc label{font-size:.7rem}
  .calc input{padding:5px 8px;font-size:max(16px,.9rem)}
  #purity,.calc .bamnote,.calc .r-world{display:none}
  .calc .seg.karats{gap:3px}
  .calc .seg.karats button{font-size:.66rem;padding:4px 0;line-height:1.1;white-space:nowrap;letter-spacing:-.01em}
  .calc .inputs{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
  .calc .inputs input{min-width:0}
  .calc .result .lab{white-space:normal;flex:1 1 4em}
  .calcsec h2{font-size:.8rem}
  .calc .result{padding-top:4px;font-size:.78rem}
  .calc .result .val{font-size:1rem}
  .amt .bam{font-size:.7rem}
  .amt .bam-main{font-size:.85rem}
  #hist-sec{display:none!important}
  .disclaimer{font-size:.58rem;line-height:1.2;text-align:center}
  #admin{gap:4px}
  #admin > details.panel{padding:4px 10px;border-radius:8px}
  #admin > details.panel > summary{font-size:.72rem;font-weight:600;color:var(--muted)}
  #admin > details.panel[open]{padding:10px}
}
/* Téléphone : l'application s'adapte à la hauteur de l'écran (texte plus grand sur les grands écrans, sans jamais dépasser) */
@media (max-width:520px){
  html{font-size:max(100%,min(calc((100vh - 230px) / 19.5),24px))}
  html{font-size:max(100%,min(calc((100dvh - 230px) / 19.5),24px))}
  #app{box-sizing:border-box;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:space-between}
  #app>*{flex:none}
  #app{justify-content:flex-start;gap:min(1.6vh,14px)}
  #app>.hero{flex:1 1 auto;align-content:space-evenly;max-height:34vh}
  #app>.calcsec{flex:2 1 auto;grid-template-rows:auto 1fr}
  #app>.calcsec>.panel.calc{align-content:space-evenly}
  #app>.disclaimer{margin-top:auto}
  .hero .big{font-size:max(1.9rem,min(7.5vh,15vw))}
  .hero .bigbam{font-size:max(.95rem,min(3.2vh,6.5vw))}
  .cta .btn-wa{padding-block:max(3px,.9vh)}
}
/* Tablettes et petits ordinateurs : texte et largeur proportionnels à l'écran */
@media (min-width:521px) and (max-width:1100px){
  html{font-size:max(100%,min(calc(100vw / 52),20px))}
  #app{max-width:min(92vw,46rem)}
}
/* Téléphone couché (paysage) : pas de remplissage forcé, défilement normal */
@media (max-height:480px) and (orientation:landscape){
  html{font-size:100%!important}
  #app{min-height:0!important;display:grid!important}
}
/* Courbe du prix — style graphique boursier */
:root{--tr-line:#a8730f;--tr-fill:#e9dcbf;--tr-bg:#f8f4ea;--tr-grid:#e2dccd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tr-line:#b88a2c;--tr-fill:#4a3d22;--tr-bg:#22253f;--tr-grid:#33375c}}
:root[data-theme="dark"]{--tr-line:#b88a2c;--tr-fill:#4a3d22;--tr-bg:#22253f;--tr-grid:#33375c}
.trend{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-height:0}
.tr-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.tr-head h2{font-size:.9rem;margin-right:auto}
.tr-chip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.tr-chip.up{color:var(--up);background:color-mix(in srgb,var(--up) 12%,transparent)}
.tr-chip.down{color:var(--down);background:color-mix(in srgb,var(--down) 12%,transparent)}
.tr-seg{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.tr-seg button{font-size:.74rem;padding:3px 4px;text-align:center;white-space:nowrap}
.tr-plot{position:relative;flex:1 1 auto;min-height:140px;height:200px}
.tr-plot svg{position:absolute;inset:0;display:block;overflow:visible;touch-action:pan-y}
.tr-bg{fill:var(--tr-bg)}
.tr-grid{stroke:var(--tr-grid);stroke-width:1}
.tr-vgrid{stroke:var(--tr-grid);stroke-width:1}
.tr-area{fill:var(--tr-fill)}
.tr-line{fill:none;stroke:var(--tr-line);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.tr-end{fill:var(--tr-line);stroke:var(--surface);stroke-width:2}
.tr-dot{fill:var(--surface);stroke:var(--tr-line);stroke-width:2}
.tr-cross{stroke:var(--muted);stroke-width:1}
.tr-axis{fill:var(--muted);font-variant-numeric:tabular-nums}
.tr-tip{position:absolute;z-index:2;pointer-events:none;background:var(--surface);color:var(--ink);border:1.5px solid var(--tr-line);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.15);padding:5px 9px;font-size:.74rem;display:grid;line-height:1.35;white-space:nowrap}
.tr-tip b{font-size:.8rem}
.tr-tip .tv{font-weight:700;font-size:.82rem}
.tr-tip .tb{color:var(--muted)}
.tr-upd{margin:0;font-size:.68rem;color:var(--muted);text-align:center}
.tr-table summary{font-size:.75rem;color:var(--muted);font-weight:500;font-family:inherit}
.tr-table ul{list-style:none;margin:4px 0 0;padding:0;max-height:200px;overflow:auto;font-size:.78rem}

    ${src?`<div class="media">${a.video?`<canvas class="bg" width="32" height="18" aria-hidden="true"></canvas><video class="main" src="${esc(a.video)}" muted playsinline preload="metadata" ${still?"controls":"autoplay"} ${L.length>1?"":"loop"}></video><button type="button" class="snd" aria-label="Activer le son">${btnSnd(true)}</button>`:`<div class="bg" style="background-image:url('${esc(a.img)}')" aria-hidden="true"></div><img class="main" src="${esc(a.img)}" alt="${esc(a.title)}">`}<button type="button" class="fs" aria-label="Plein écran">${btnFs(false)}</button></div>`:""}
    <div class="slide">
      <div><p class="t">${esc(a.title)}</p>${a.text?`<p class="d">${esc(a.text)}</p>`:""}
      ${a.tel?`<p class="tel"><b>${esc(a.tel)}</b><a href="tel:${esc(a.tel.replace(/[^+\d]/g,""))}">Appeler</a></p>`:""}</div></div>
    ${L.length>1?`<div class="dots">${L.map((_,i)=>`<button type="button" data-ad="${i}" aria-label="Annonce ${i+1}" aria-current="${i===adIdx}"></button>`).join("")}</div>`:""}</div>`;
  box.querySelectorAll("[data-ad]").forEach(b=>b.onclick=()=>{adIdx=+b.dataset.ad;renderAd();startAds()});
  const v=box.querySelector("video"), snd=box.querySelector(".snd");
  const med=box.querySelector(".media");
  if(med){
    const el=med.querySelector(".main"), ratio=(w,h)=>{if(w&&h) med.style.aspectRatio=w+"/"+h};
    if(a.video){
      if(el.readyState>=1) ratio(el.videoWidth,el.videoHeight); else el.addEventListener("loadedmetadata",()=>ratio(el.videoWidth,el.videoHeight));
      const cv=med.querySelector("canvas.bg"), cx=cv&&cv.getContext&&cv.getContext("2d");
      if(cx){const tick=()=>{if(!el.isConnected) return; try{cx.drawImage(el,0,0,32,18)}catch(e){} setTimeout(tick,400)}; el.addEventListener("loadeddata",tick,{once:true})}
    } else { if(el.complete&&el.naturalWidth) ratio(el.naturalWidth,el.naturalHeight); else el.addEventListener("load",()=>ratio(el.naturalWidth,el.naturalHeight)) }
    const fs=med.querySelector(".fs"), req=med.requestFullscreen||med.webkitRequestFullscreen;
    if(!req) fs.hidden=true;
    else fs.onclick=()=>{ if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document); fs.innerHTML=btnFs(false);fs.setAttribute("aria-label","Plein écran")} else {const r=req.call(med); fs.innerHTML=btnFs(true);fs.setAttribute("aria-label","Quitter le plein écran"); if(r&&r.catch) r.catch(()=>{fs.innerHTML=btnFs(false)})} };
  }
  if(v){
    v.addEventListener("ended",nextAd);
    v.addEventListener("error",()=>{clearTimeout(adTimer);adTimer=setTimeout(nextAd,6000)});
    const p=v.play&&!v.hasAttribute("controls")?v.play():null; if(p&&p.catch) p.catch(()=>{v.setAttribute("controls","")});
    if(snd) snd.onclick=()=>{v.muted=!v.muted; snd.innerHTML=btnSnd(v.muted); snd.setAttribute("aria-label",v.muted?"Activer le son":"Couper le son"); if(v.paused){const q=v.play(); if(q&&q.catch) q.catch(()=>{})}};
  }
}
function nextAd(){const L=liveAds(); if(L.length<2) return; adIdx=(adIdx+1)%L.length; renderAd(); startAds()}
function startAds(){
  clearTimeout(adTimer); if(PHONE.matches) return; const L=liveAds(); if(L.length<2) return;

}
function updateOut(){const g=document.getElementById("outg"),pu=document.getElementById("purity"); if(g) g.textContent=fcfa(perGram(calc.k)); if(pu) pu.textContent="Pureté "+(calc.k/24*1000).toFixed(1).replace(".",",")+" ‰ · prix 24 carats × "+String(calc.k).replace(".",",")+" ÷ 24";
const o=document.getElementById("out"),w=document.getElementById("outw"); if(o) o.textContent=fcfa(perGram(calc.k)*(calc.grams||0)); if(w) w.textContent=fcfa(world(calc.k)*(calc.grams||0));
const set=(id,v)=>{const e=document.getElementById(id); if(e) e.textContent=bam(v)};
const fit=()=>{["out","out-b","outg","outg-b","outw","outw-b"].forEach(id=>{const e=document.getElementById(id); if(!e) return; const n=e.textContent.length; e.style.fontSize=n>17?".76em":n>14?".86em":""})}; set("outg-b",perGram(calc.k)); set("out-b",perGram(calc.k)*(calc.grams||0)); set("outw-b",world(calc.k)*(calc.grams||0)); fit()}
function keep(){try{localStorage.setItem("calc",JSON.stringify(calc))}catch(e){}}
function bind(){
  const lb=document.getElementById("listen"); if(lb&&TTS){lb.hidden=false; lb.onclick=()=>{stopBm();speak(lb)}}
  const bb=document.getElementById("listen-bm"); if(bb&&bmReady()){bb.hidden=false; bb.onclick=()=>{if(TTS) speechSynthesis.cancel(); document.getElementById("listen")?.classList.remove("on"); playBm(bb)}}
  app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{calc.k=+b.dataset.k;keep();render()});
  const ci=document.getElementById("carat"); ci.oninput=()=>{const k=parseFloat(ci.value.replace(",","."));
    if(k>=1&&k<=24){calc.k=k;ci.removeAttribute("aria-invalid");keep();updateOut();app.querySelectorAll("[data-k]").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.k===k)))}
    else ci.setAttribute("aria-invalid","true")};
  const gi=document.getElementById("grams"); gi.oninput=()=>{const g=parseFloat(gi.value.replace(/\s/g,"").replace(",","."));
    if(gi.value.trim()===""){calc.grams=0;gi.removeAttribute("aria-invalid")}
    else if(g>=0&&g<=100000){calc.grams=g;gi.removeAttribute("aria-invalid")}
    else {gi.setAttribute("aria-invalid","true");return}
    keep();updateOut()};
  if(window._art) document.getElementById("admin").hidden=false;
  if(assets) document.getElementById("a-img-wrap").hidden=false;
  const sv=document.getElementById("save"); if(sv) sv.onclick=save;
  const ab=document.getElementById("a-add"); if(ab) ab.onclick=addAd;
  app.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{const N=clone();const a=N.ads[+b.dataset.toggle];a.on=a.on===false;publishState(N,document.getElementById("amsg"),b,"Annonce mise à jour.")});
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Confirmer la suppression";return}
    const N=clone();N.ads.splice(+b.dataset.del,1);publishState(N,document.getElementById("amsg"),b,"Annonce supprimée.")});
}

async function addAd(){
  const m=document.getElementById("amsg"), btn=document.getElementById("a-add");
  const title=document.getElementById("a-title").value.trim(), text=document.getElementById("a-text").value.trim(), tel=document.getElementById("a-tel").value.trim();
  const f=document.getElementById("a-img").files[0];
  if(!title){m.className="msg err";m.textContent="Indiquez au moins le nom de l'annonceur.";return}
  const ad={id:Date.now().toString(36),title,text,tel,img:"",on:true};
  const isVid=!!(f&&f.type&&f.type.indexOf("video/")===0);
  if(f&&f.size>20*1024*1024){m.className="msg err";m.textContent=(isVid?"La vidéo":"L'image")+" fait plus de 20 Mo. Choisissez un fichier plus léger, ou une vidéo plus courte.";return}
  btn.disabled=true;
  if(f&&assets){
    m.className="msg";m.textContent=isVid?"Envoi de la vidéo… (cela peut prendre une minute)":"Envoi de l'image…";
    try{const r=await assets.upload(f); if(isVid) ad.video=r.url; else ad.img=r.url}
    catch(e){btn.disabled=false;m.className="msg err";m.textContent=(isVid?"La vidéo":"L'image")+" n'a pas pu être envoyée. Vérifiez la connexion et réessayez, ou ajoutez l'annonce sans fichier.";return}
  }

async function publishState(N,m,btn,okText){

  const doc='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+body+'</body></html>';
  btn.disabled=true; m.className="msg"; m.textContent="Publication…";

var fitBusy=false;
function fitPhone(){ if(fitBusy) return; fitBusy=true; const de=document.documentElement; de.style.fontSize="";
  if(PHONE.matches&&!matchMedia("(orientation:landscape) and (max-height:480px)").matches){
    let f=parseFloat(getComputedStyle(de).fontSize), n=0;
    while(de.scrollHeight>window.innerHeight+1&&f>12&&n<60){f-=0.5;n++;de.style.fontSize=f+"px"}
  }
  fitBusy=false}
