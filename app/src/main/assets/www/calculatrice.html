<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout : un seul écran façon comptoir de bijoutier — en-tête, tuiles de saisie, carats, résultat, pavé numérique intégré */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --ink:#141A2B; --muted:#5D6578; --line:#D5DAE3;
  --gold:#A9781F; --gold-soft:#F5E9CC; --panel:#141A2B; --on-panel:#F4EFE3; --key:#FFFFFF; --key-alt:#E3E7EE;
  --f:"Archivo","Arial Narrow","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F131C; --surface:#1A2030; --ink:#EEF0F4; --muted:#9AA3B5; --line:#2B3346;
  --gold:#E0B252; --gold-soft:#3A2F17; --panel:#232B40; --on-panel:#F4EFE3; --key:#1F2638; --key-alt:#2A3247; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F131C; --surface:#1A2030; --ink:#EEF0F4; --muted:#9AA3B5; --line:#2B3346;
  --gold:#E0B252; --gold-soft:#3A2F17; --panel:#232B40; --on-panel:#F4EFE3; --key:#1F2638; --key-alt:#2A3247; color-scheme:dark}

html{height:100%;font-size:clamp(13px,min(4.2vw,2.15vh),20px);font-size:clamp(13px,min(4.2vw,2.15dvh),20px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box}
body{min-height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:var(--f);line-height:1.2;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:.6rem .8rem;
  -webkit-tap-highlight-color:transparent;user-select:none}
.app{flex:1;width:100%;max-width:30rem;margin:0 auto;display:flex;flex-direction:column;gap:clamp(6px,1.3vh,14px)}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* En-tête */
.top{display:flex;flex-direction:column;align-items:center;gap:.1rem}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,42%);align-items:center;gap:.6rem;overflow:hidden}
.hero h1{min-width:0;overflow-wrap:normal;word-break:normal}
.lingot{display:block;width:100%;max-width:100%;height:auto;max-height:min(5.5rem,11vh);border-radius:10px;object-fit:cover;box-shadow:0 3px 8px rgba(0,0,0,.22)}
.brand{display:flex;align-items:center;gap:.55rem;font-weight:900;font-stretch:115%;letter-spacing:.1em;font-size:1.25rem}
.brand i{width:.75rem;height:.75rem;background:var(--gold);transform:rotate(45deg);border-radius:2px;flex:none}
.tel{font-weight:800;font-size:.95rem;color:var(--gold);font-variant-numeric:tabular-nums;user-select:all;white-space:nowrap}
h1{margin:0;font-weight:900;font-stretch:72%;font-size:2.4rem;line-height:1;letter-spacing:-.01em}
h1 span{color:var(--gold)}

.top{position:relative;width:100%;padding-inline:2.4rem}
.back{position:absolute;left:0;top:50%;transform:translateY(-50%);width:2rem;height:2rem;display:grid;place-items:center;font-size:1.4rem;line-height:1;font-weight:800;color:var(--ink);text-decoration:none;background:var(--surface);border:1.5px solid var(--line);border-radius:50%;padding:0 0 .15rem}
.back:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* Tuiles de saisie */
.tile{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:.55rem .75rem;text-align:left;cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:.15rem}
.tile[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.lab{font-size:.72rem;font-weight:700;font-stretch:80%;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.val{font-weight:800;font-size:1.6rem;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;display:flex;align-items:baseline;gap:.25rem}
.val small{font-size:.8rem;font-weight:700;color:var(--muted)}
.sub{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.caret::after{content:"";display:inline-block;width:2px;height:1em;background:var(--gold);margin-left:1px;align-self:center;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.caret::after{animation:none}}

.prix{display:grid;grid-template-columns:1fr 1fr;gap:clamp(6px,1.3vh,12px)}
.prix-head{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;padding-inline:.15rem}
.prix-head b{font-size:.78rem;font-weight:800;font-stretch:85%;letter-spacing:.06em;text-transform:uppercase}
.prix-head span{font-size:.72rem;color:var(--muted)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:clamp(6px,1.3vh,12px)}
.bar{height:.35rem;border-radius:9px;background:var(--line);overflow:hidden;margin-top:.15rem}
.bar i{display:block;height:100%;background:var(--gold);border-radius:9px;transition:width .2s}

/* Carats rapides */
.chips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;height:clamp(30px,4.6vh,40px);font-weight:800;font-size:.9rem;cursor:pointer;font-variant-numeric:tabular-nums;padding:0;min-width:0}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#fff}

/* Résultat */
.result{background:var(--panel);color:var(--on-panel);border-radius:16px;padding:.7rem .9rem;display:flex;flex-direction:column;justify-content:center;gap:.25rem;flex:1 1 auto;min-height:0}
.result .lab{color:var(--on-panel);opacity:.7}
.big{display:flex;align-items:baseline;gap:.4rem;min-width:0}
.big b{font-weight:900;font-size:2.4rem;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;min-width:0;line-height:1.05}
.big span{font-weight:700;font-size:.95rem;opacity:.8;flex:none}
.big.bam b{font-size:1.7rem;color:var(--gold)}
.detail{display:flex;justify-content:space-between;align-items:center;gap:.5rem;border-top:1px solid rgba(244,239,227,.18);padding-top:.4rem;margin-top:.2rem}
.detail span{font-size:.78rem;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.copy{flex:none;border:1.5px solid rgba(244,239,227,.4);background:transparent;border-radius:999px;padding:.3rem .7rem;font-size:.78rem;font-weight:700;cursor:pointer;color:var(--on-panel)}

/* Pavé numérique */
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(5px,1vh,10px)}
.key{border:0;border-radius:12px;background:var(--key);height:clamp(36px,6.2vh,62px);font-size:1.35rem;font-weight:700;cursor:pointer;box-shadow:0 1px 0 var(--line);font-variant-numeric:tabular-nums}
.key:active{transform:translateY(1px);background:var(--key-alt)}
.key.alt{background:var(--key-alt);font-size:1rem}
.key.go{background:var(--gold);color:#fff;font-size:1rem}
/* Mode application Android : toute la largeur, le pavé prend la place libre */
html.modeapp body{padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:.4rem}
html.modeapp .app{max-width:none}
/* Téléphone : toute la largeur de l'écran, sans bandes vides sur les côtés */
@media (max-width:640px){.app{max-width:none}body{padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}}
</style>

<script>
const $=id=>document.getElementById(id);
const CARATS=[24,23,22,21,20,19,18];
const LIM={prixF:8,prixB:8,carat:2,poids:6};
const ORDER=['prixF','carat','poids'];
const sp=s=>s.replace(/ | /g,' ');
const fmt=n=>sp(Math.round(n).toLocaleString('fr-FR'));
const px=n=>Math.abs(n-Math.round(n))<0.005?fmt(n):sp(n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}));
const num=s=>{const v=parseFloat(String(s).replace(/\s/g,'').replace(',','.'));return isFinite(v)?v:0};
const grp=b=>{const [i,d]=b.split(',');const g=(i||'0').replace(/\B(?=(\d{3})+(?!\d))/g,' ');return d===undefined?g:g+','+d;};
const txt=v=>String(Math.round(v*100)/100).replace('.',',');
// Poids : en grammes jusqu'à 999, en kilos à partir de 1 000 g
const kg=g=>sp((g/1000).toLocaleString('fr-FR',{maximumFractionDigits:3}));
const poidsTxt=g=>g>=1000?kg(g)+' kg':txt(g)+' g';

// État : prix 24 K en FCFA, carat, poids
let P=72500, carat=24, poids=10, active='poids', buf='', fresh=true;
try{const s=JSON.parse(localStorage.getItem('diarra-or-v2')||'{}');if(s.P>0&&s.P<1e8)P=s.P;if(s.c>=1&&s.c<=24)carat=s.c;}catch(e){}
const hp=(location.hash.match(/prix=(\d+)/)||[])[1]; if(hp&&+hp>1000&&+hp<1e7) P=+hp;
const save=()=>{try{localStorage.setItem('diarra-or-v2',JSON.stringify({P,c:carat}))}catch(e){}};

function select(f){active=f;fresh=true;buf=valueOf(f);render();}
function valueOf(f){return f==='prixF'?txt(P):f==='prixB'?txt(P/5):f==='carat'?txt(carat):txt(poids);}
function commit(){
  const v=num(buf);
  if(active==='prixF')P=v; else if(active==='prixB')P=v*5;
  else if(active==='carat')carat=v; else poids=v;
  save();render();
}
function press(k){
  if(k==='next'){select(ORDER[(ORDER.indexOf(active==='prixB'?'prixF':active)+1)%ORDER.length]);return;}
  if(k==='reset'){carat=0;poids=0;save();select('carat');return;}
  if(k==='clear'){buf='0';fresh=true;commit();return;}
  if(k==='back'){buf=fresh?'0':(buf.slice(0,-1)||'0');fresh=false;commit();return;}
  let b=fresh?'':buf; fresh=false;
  if(b==='0')b='';
  const add=k===','?(b.includes(',')?'':(b===''?'0,':',')):k;
  let nb=b+add;
  const [i,d]=nb.split(',');
  if((i||'').length>LIM[active])return;
  if(d!==undefined&&d.length>2)return;
  if(active==='carat'&&num(nb)>24)return;
  buf=nb||'0';commit();
}

function render(){
  document.querySelectorAll('.tile').forEach(t=>t.setAttribute('aria-pressed',t.dataset.f===active));
  const show=(id,f,def)=>{const el=$(id);const on=active===f;el.textContent=on?grp(buf):def;el.classList.toggle('caret',on);};
  show('vPrixF','prixF',fmt(P));
  show('vPrixB','prixB',px(P/5));
  show('vCarat','carat',txt(carat));
  show('vPoids','poids',txt(poids));
  if(poids>=1000){$('vPoids').textContent=kg(poids);$('uPoids').textContent='kg';}
  else $('uPoids').textContent='g';
  const pur=Math.min(carat,24)/24, pg=P*pur, tot=pg*poids;
  $('barre').style.width=(pur*100)+'%';
  $('purete').textContent=sp((pur*100).toLocaleString('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1}))+' % d’or pur';
  $('pgF').textContent=px(pg)+' F / g';
  $('pgB').textContent=px(pg/5)+' Bam / g';
  $('totF').textContent=fmt(tot);
  $('totB').textContent=fmt(tot/5);
  $('detail').textContent=poidsTxt(poids)+' × '+px(pg)+' F (or '+txt(carat)+' K)';
  $('chips').innerHTML=CARATS.map(c=>`<button type="button" class="chip" data-c="${c}" aria-pressed="${c===carat}">${c}</button>`).join('');
  fitAll();
}
function fitAll(){
  document.querySelectorAll('.fit').forEach(el=>{
    el.style.fontSize='';
    const box=el.closest('.val,.big')||el;
    let s=parseFloat(getComputedStyle(el).fontSize);
    const over=()=>el.scrollWidth>el.clientWidth+1||box.scrollWidth>box.clientWidth+1;
    while(s>10&&over()){s-=1;el.style.fontSize=s+'px';}
  });
}

document.querySelectorAll('.tile').forEach(t=>t.addEventListener('click',()=>select(t.dataset.f)));
$('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;carat=+b.dataset.c;save();select('poids');});
$('pad').addEventListener('click',e=>{const b=e.target.closest('.key');if(b)press(b.dataset.k);});
addEventListener('keydown',e=>{
  if(/^[0-9]$/.test(e.key))press(e.key);
  else if(e.key===','||e.key==='.')press(',');
  else if(e.key==='Backspace')press('back');
  else if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();press('next');}
  else if(e.key==='Escape')press('clear');
});
$('copier').addEventListener('click',async()=>{
  const t=`DIARRA OR (79 31 34 71)\nOr ${txt(carat)} K, ${poidsTxt(poids)}\nPrix : ${$('totF').textContent} FCFA (${$('totB').textContent} Bam)`;
  const b=$('copier');
  try{await navigator.clipboard.writeText(t);b.textContent='Copié';}
  catch(e){const r=document.createRange();r.selectNodeContents($('totF'));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Sélectionné';}
  setTimeout(()=>b.textContent='Copier',1600);
});
// Dans l'appli Claude, le téléphone agrandit le texte tout seul. Dans un navigateur, il ne le fait pas :
// on mesure cet agrandissement et, s'il manque, on l'applique nous-mêmes pour avoir le même rendu partout.
function echelle(){
  const html=document.documentElement;
  html.style.fontSize='';
  const t=document.createElement('div');
  t.style.cssText='position:absolute;visibility:hidden;left:0;top:0;width:400px';
  t.innerHTML='<span style="display:inline-block;font-size:100px;line-height:1;font-family:Arial">M</span>';
  document.body.appendChild(t);
  const z=t.firstChild.getBoundingClientRect().height/100;
  t.remove();
  const base=parseFloat(getComputedStyle(html).fontSize);
  let f=z<1.08?1.28:1;
  const apply=()=>{html.style.fontSize=Math.min(base*f,24)+'px';fitAll();};
  if(f!==1)apply();
  let fs=parseFloat(getComputedStyle(html).fontSize), n=0;
  const visible=()=>Math.min(innerHeight,(window.visualViewport&&visualViewport.height)||innerHeight,document.documentElement.clientHeight||innerHeight);
  while(html.scrollHeight>visible()+1&&fs>13&&n<60){fs-=0.5;n++;html.style.fontSize=fs+'px';}
  if(html.scrollHeight<=visible()+1) scrollTo(0,0);
  // Dans l'application Android (lien #app) : tout doit tenir sur un seul écran, sans défiler
  if(/(^#|&)app(&|$)/.test(location.hash))html.classList.add('modeapp');
  fitAll();
}
echelle();
addEventListener('resize',echelle);
addEventListener('load',echelle);
setTimeout(echelle,400);setTimeout(echelle,1200);setTimeout(echelle,2500);
if(document.fonts){document.fonts.ready.then(echelle);document.fonts.addEventListener&&document.fonts.addEventListener('loadingdone',echelle);}
if(window.visualViewport)visualViewport.addEventListener('resize',echelle);
select('poids');
</script>
