name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Construire l'APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk sanu-prix-bamako.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sanu-prix-bamako-apk
          path: sanu-prix-bamako.apk
      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sanu Prix à Bamako 1.0.${{ github.run_number }}
          body: "Téléchargez **sanu-prix-bamako.apk** sur votre téléphone Android, puis ouvrez-le pour installer Sanu Prix à Bamako."
          files: sanu-prix-bamako.apk
          make_latest: true
